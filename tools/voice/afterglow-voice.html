<title>Afterglow Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* layout: one column, the latest reply large in the middle, the talk box pinned under it */
:root{
  --bg:#f3f1f7; --panel:#ffffff; --fg:#1d1a26; --muted:#5f5a70; --line:#dcd7e8;
  --accent:#6b3fd4; --accent-fg:#ffffff; --live:#1f8a5b; --warn:#b3471d;
  --display:"Chakra Petch", "Trebuchet MS", sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f0d16; --panel:#1a1725; --fg:#ece8f6; --muted:#a39db8; --line:#2f2a40;
  --accent:#a98bff; --accent-fg:#140f22; --live:#4fd39a; --warn:#ff9a6b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f0d16; --panel:#1a1725; --fg:#ece8f6; --muted:#a39db8; --line:#2f2a40;
  --accent:#a98bff; --accent-fg:#140f22; --live:#4fd39a; --warn:#ff9a6b; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font:16px/1.55 var(--body); margin:0}
.wrap{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:20px 28px; display:flex; flex-direction:column; gap:18px; min-height:100%; box-sizing:border-box}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
h1{font:600 22px/1.2 var(--display); letter-spacing:.02em; margin:0; text-wrap:balance}
.state{font:500 13px var(--display); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:8px}
.dot{width:9px; height:9px; border-radius:50%; background:var(--muted)}
.state.on .dot{background:var(--live); box-shadow:0 0 0 4px color-mix(in srgb, var(--live) 25%, transparent)}
.state.speaking .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5)}}
@media (prefers-reduced-motion: reduce){ .state.speaking .dot{animation:none} }
button{font:600 15px var(--display); letter-spacing:.04em; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--fg); padding:10px 16px; cursor:pointer}
button:focus-visible, textarea:focus-visible, select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
button:disabled{opacity:.5; cursor:default}
.start{font-size:18px; padding:16px 22px; width:100%}
.reply{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:12px; min-width:0}
.label{font:500 12px var(--display); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
#replyText{font-size:20px; line-height:1.5; margin:0; white-space:pre-wrap; overflow-wrap:anywhere; max-width:65ch}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.row select{font:15px var(--body); padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--fg); max-width:100%; min-width:0}
.talk{display:flex; flex-direction:column; gap:10px}
textarea{font:18px/1.45 var(--body); width:100%; box-sizing:border-box; min-height:96px; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); resize:vertical}
.hint{font-size:14px; color:var(--muted); margin:0}
#sendState{font-size:14px; color:var(--muted); margin:0; min-height:1.4em}
#sendState.bad{color:var(--warn)}
.earlier{display:flex; flex-direction:column; gap:8px}
.earlier p{margin:0; padding:10px 12px; border-left:3px solid var(--line); color:var(--muted); font-size:15px; overflow-wrap:anywhere}
</style>

<div class="wrap">
  <header>
    <h1>Afterglow Voice</h1>
    <div class="state" id="state"><span class="dot"></span><span id="stateText">Voice off</span></div>
  </header>

  <button class="start primary" id="startBtn">Turn on voice</button>

  <section class="reply" aria-live="polite">
    <span class="label">Claude said</span>
    <p id="replyText">Replies from the Claude session working on Afterglow appear here and are read aloud. Turn on voice once, then leave this page open.</p>
    <div class="row">
      <button id="replayBtn" disabled>Say it again</button>
      <button id="stopBtn" disabled>Stop</button>
      <select id="voiceSel" aria-label="Voice"></select>
      <select id="rateSel" aria-label="Speed">
        <option value="0.9">Slower</option><option value="1" selected>Normal speed</option><option value="1.15">Faster</option><option value="1.3">Fastest</option>
      </select>
    </div>
  </section>

  <section class="talk">
    <label class="label" for="msg">Talk to Claude</label>
    <textarea id="msg" placeholder="Speak or type. On a Mac, press Fn twice to dictate; on a phone, tap the keyboard's microphone."></textarea>
    <div class="row">
      <button class="primary" id="sendBtn">Send to Claude</button>
      <p class="hint">Enter sends · Shift+Enter for a new line</p>
    </div>
    <p id="sendState"></p>
  </section>

  <section class="earlier" id="earlierBox" hidden>
    <span class="label">Earlier</span>
    <div id="earlier" class="earlier"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const store = {get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} }};
let voiceOn = false, voices = [], latest = null, lastSpokenId = store.get('voice.lastId'), threadId = null, earlier = [];
const synth = window.speechSynthesis;

// ---- speaking: a reply is split into sentences (browsers cut long utterances short) and queued ----
function setState(){ const s = $('#state'); s.classList.toggle('on', voiceOn); s.classList.toggle('speaking', voiceOn && synth && synth.speaking);
  $('#stateText').textContent = !synth ? 'This browser cannot speak' : !voiceOn ? 'Voice off' : synth.speaking ? 'Speaking' : 'Listening for replies'; }
function speak(text){
  if (!synth || !voiceOn || !text) return;
  synth.cancel();
  const v = voices.find(x => x.voiceURI === $('#voiceSel').value), rate = +$('#rateSel').value;
  const parts = text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]*\s*/g) || [text];
  parts.forEach((p, i) => { const u = new SpeechSynthesisUtterance(p.trim()); if (v) u.voice = v; u.rate = rate;
    u.onstart = setState; if (i === parts.length - 1) u.onend = u.onerror = () => setTimeout(setState, 50); synth.speak(u); });
  setState();
}
function loadVoices(){
  if (!synth) return;
  voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
  const sel = $('#voiceSel'), keep = store.get('voice.uri') || sel.value;
  sel.innerHTML = '';
  // natural-sounding voices first
  voices.sort((a, b) => (/(natural|premium|enhanced|google)/i.test(b.name) ? 1 : 0) - (/(natural|premium|enhanced|google)/i.test(a.name) ? 1 : 0));
  for (const v of voices) { const o = document.createElement('option'); o.value = v.voiceURI; o.textContent = v.name; sel.append(o); }
  if (keep && voices.some(v => v.voiceURI === keep)) sel.value = keep;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
$('#voiceSel').addEventListener('change', e => store.set('voice.uri', e.target.value));
$('#startBtn').addEventListener('click', () => {
  if (!synth) { setState(); return; }
  voiceOn = true; $('#startBtn').hidden = true; $('#replayBtn').disabled = !latest; $('#stopBtn').disabled = false;
  // speaking once from the tap unlocks the browser's voice for the replies that arrive later
  speak(latest && latest.id !== lastSpokenId ? latest.text : 'Voice on. I will read out each reply as it arrives.');
  if (latest) { lastSpokenId = latest.id; store.set('voice.lastId', latest.id); }
});
$('#replayBtn').addEventListener('click', () => latest && speak(latest.text));
$('#stopBtn').addEventListener('click', () => { synth && synth.cancel(); setTimeout(setState, 50); });
setState();

// ---- replies: the session writes voice/latest; each new one is shown and spoken ----
function show(doc){
  if (latest && latest.id !== doc.id) { earlier.unshift(latest.text); earlier = earlier.slice(0, 6); renderEarlier(); }
  latest = doc; $('#replyText').textContent = doc.text; $('#replayBtn').disabled = !voiceOn;
  if (voiceOn && doc.id !== lastSpokenId) { lastSpokenId = doc.id; store.set('voice.lastId', doc.id); speak(doc.text); }
}
function renderEarlier(){ const box = $('#earlier'); box.innerHTML = ''; for (const t of earlier) { const p = document.createElement('p'); p.textContent = t; box.append(p); } $('#earlierBox').hidden = !earlier.length; }
(async () => {
  const db = window.claude && await claude.use('db');
  if (!db) { $('#replyText').textContent = 'Replies can\'t reach this view. Open it from claude.ai while signed in.'; return; }
  db.doc('voice/latest').onSnapshot(s => { if (s.exists) { const d = s.data(); if (d && d.text) show({id: String(d.id), text: String(d.text)}); } },
    () => { $('#replyText').textContent = 'Replies stopped arriving. Reload the page to reconnect.'; });
})();

// ---- talking: the text goes to the Claude session as a comment sent to Claude ----
let comments = null;
(async () => { comments = window.claude && await claude.use('comments'); if (!comments) { $('#sendBtn').disabled = true; note('Sending isn\'t available in this view.', true); } })();
function note(t, bad){ const s = $('#sendState'); s.textContent = t; s.classList.toggle('bad', !!bad); }
async function send(){
  const text = $('#msg').value.trim();
  if (!text || !comments) return;
  const can = await comments.canSendToClaude().catch(() => 'off');
  if (can !== 'available') { note(can === 'no_session' ? 'No Claude session is listening right now. Your words are kept here; try again in a moment.' : 'Sending to Claude isn\'t available here: you need edit access to this page.', true); return; }
  $('#sendBtn').disabled = true; note('Sending…');
  try {
    const r = await comments.sendToClaude(threadId ? {threadId, text} : {anchor: await comments.anchorFor($('#msg')), text});
    threadId = r.threadId; $('#msg').value = ''; note('Sent. The reply will be read out when it arrives.');
  } catch (e) {
    const c = e && e.code;
    if (c === 'not_found') threadId = null;
    note(c === 'consent_required' ? 'Not sent: allow this page to comment for you, then press Send again.' : c === 'rate_limited' ? 'Not sent: that was quick after the last one. Wait a moment and send again.'
      : c === 'claude_unavailable' ? 'Not sent: no Claude session could take it. Your words are kept here.' : 'Not sent (' + (c || 'error') + '). Your words are kept here.', true);
  } finally { $('#sendBtn').disabled = false; }
}
$('#sendBtn').addEventListener('click', send);
$('#msg').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
