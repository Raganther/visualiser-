<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Studio DAW</title>
<!-- Studio DAW: the songs from Studio Jam in a traditional layout. The tracks down the left (level, pan, mute, solo, a
     like and a note each), the arrangement to the right (sections named across the top, the chords under them, the clips
     with their notes), and under it the piano roll of the clip being edited with each note's velocity beneath. -->
<style>
:root{--bg:#16181d; --panel:#1f2228; --panel2:#262a31; --line:#343944; --ink:#e7e9ee; --mute:#9aa1ad; --acc:#e0a33a; --on:#c86b2c; --sel:#ffffff; --loop:rgba(224,163,58,.18); --mono:ui-monospace,SFMono-Regular,Menlo,monospace; color-scheme:dark}
*{box-sizing:border-box} html,body{margin:0; height:100%} body{background:var(--bg); color:var(--ink); font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif; display:flex; flex-direction:column; overflow:hidden}
button,select,input{font:inherit; color:inherit} button{background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:5px 10px; cursor:pointer; min-height:32px}
button:hover{border-color:#566} button[aria-pressed="true"]{background:var(--acc); color:#111; border-color:var(--acc)} button:disabled{opacity:.4; cursor:default}
select{background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:5px 8px; min-height:32px}
.bar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line)}
.bar h1{font-size:15px; margin:0 6px 0 0; letter-spacing:.02em} .spacer{flex:1}
#play{background:var(--on); border-color:var(--on); color:#fff; min-width:72px; font-weight:600}
#pos{font:600 15px var(--mono); min-width:86px; text-align:center; background:#0f1114; border:1px solid var(--line); border-radius:7px; padding:5px 8px}
.muted{color:var(--mute)} .small{font-size:12px}
#status{font-size:12px; color:var(--mute); white-space:nowrap}
#main{flex:1; display:flex; min-height:0}
#tracks{width:250px; flex:none; background:var(--panel); border-right:1px solid var(--line); overflow:hidden; position:relative}
#rulerHead{height:72px; position:relative; z-index:1; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 10px; display:flex; flex-direction:column; justify-content:center; gap:2px}
.trk{height:56px; border-bottom:1px solid var(--line); padding:4px 8px; display:grid; grid-template-columns:1fr auto; gap:2px 6px; align-items:center; cursor:default}
.trk[data-sel="1"]{background:#2a2f37} .trk .nm{font-weight:600; font-size:13px; padding-left:6px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis} .trk .snd{font-size:11px; font-weight:400; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.trk .btns{display:flex; gap:3px} .trk .btns button{min-height:24px; min-width:26px; padding:0 5px; font-size:12px; border-radius:5px}
.trk .ms[aria-pressed="true"].s{background:#3b82c4; border-color:#3b82c4; color:#fff}
.trk .sliders{display:flex; gap:6px; align-items:center; grid-column:1 / -1} .trk input[type=range]{width:100%; accent-color:var(--acc); height:16px}
.trk .sliders .pan{width:60px; flex:none}
#arrWrap{flex:1; position:relative; min-width:0} #arr,#ed{touch-action:none} #arr{display:block; width:100%; height:100%; cursor:default}
#split{height:6px; background:var(--line); cursor:ns-resize; flex:none}
#editor{height:36%; flex:none; display:flex; flex-direction:column; min-height:120px; background:var(--panel)}
#edHead{display:flex; gap:8px; align-items:center; padding:5px 12px; border-bottom:1px solid var(--line); flex-wrap:wrap}
#edHead b{font-size:13px} #edWrap{flex:1; position:relative; min-height:0} #ed{display:block; width:100%; height:100%}
#notes{position:fixed; right:12px; top:56px; width:340px; max-height:70vh; overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; box-shadow:0 10px 30px rgba(0,0,0,.4); z-index:5}
#notes h2{font-size:14px; margin:0 0 6px} #notes textarea{width:100%; min-height:70px; background:#0f1114; color:var(--ink); border:1px solid var(--line); border-radius:7px; padding:6px; font:inherit; resize:vertical}
.note{border-top:1px solid var(--line); padding:6px 0; font-size:13px} .note .tg{color:var(--acc); font-size:12px; cursor:pointer} .note .x{float:right; min-height:22px; padding:0 6px}
#target{font-size:12px; color:var(--acc); flex:0 1 220px; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#help{font-size:12px; color:var(--mute)}
#flash{position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#000c; padding:6px 12px; border-radius:8px; font-size:13px; pointer-events:none; opacity:0; transition:opacity .2s}
#flash[data-on="1"]{opacity:1}
/* a phone: listen, loop a section (tap its name), and leave notes; editing is for a computer */
body.phone #split, body.phone #editor, body.phone #undo, body.phone #redo, body.phone #snapL, body.phone .trk .sliders{display:none} body.phone .trk{grid-template-columns:1fr}
@media (max-width:720px){ #tracks{width:150px} .trk .sliders .pan{display:none} #notes{left:8px; right:8px; width:auto} }
</style>
<div class="bar">
  <h1>Studio DAW</h1>
  <select id="songSel" aria-label="Song"></select>
  <button id="play" title="Play / stop (Space)">Play</button>
  <button id="cycle" aria-pressed="false" title="Loop the selected bars (C). Drag across the bar numbers to choose them">⟲ Cycle</button>
  <span id="pos" aria-label="Position">1.1.1</span>
  <span class="muted small" id="tempo"></span>
  <label class="small muted" id="snapL">Snap <select id="snap"><option value="16">Bar</option><option value="4">Beat</option><option value="1" selected>1/16</option><option value="0">Off</option></select></label>
  <button id="undo" title="Undo (⌘Z)">↶</button><button id="redo" title="Redo (⇧⌘Z)">↷</button>
  <button id="engAB" aria-pressed="true" title="Claude's mix or the plain one">Mix: Claude’s</button>
  <button id="ver" title="Your version, or Claude's as it was written">Yours</button>
  <span class="spacer"></span>
  <span id="target" title="What a like or a note is about: the selection"></span>
  <button id="up" title="Like the selection">👍</button><button id="down" title="Dislike the selection">👎</button><button id="say" title="A note for Claude about the selection">💬</button>
  <button id="notesB" aria-pressed="false" title="Your notes on this song">Notes</button>
  <span id="status"></span>
</div>
<div id="main">
  <div id="tracks"><div id="rulerHead"><b class="small">Sections · bars · chords</b><span class="muted small">drag the bar numbers to loop</span></div><div id="trackList"></div></div>
  <div id="arrWrap"><canvas id="arr" tabindex="0" aria-label="The arrangement"></canvas></div>
</div>
<div id="split" title="Drag to resize the editor"></div>
<section id="editor" aria-label="The piano roll">
  <div id="edHead"><b id="edName">Double-click a clip to edit its notes</b><span class="muted small" id="edInfo"></span><span class="spacer"></span>
    <span id="help">Click: add a note · drag: move · drag an end: length · box-drag: select · ⌥-drag: copy · arrows: nudge · velocity below</span></div>
  <div id="edWrap"><canvas id="ed" tabindex="0" aria-label="Notes and velocity"></canvas></div>
</section>
<aside id="notes" hidden><h2>Notes on this song</h2><div id="composer" hidden><div class="small" id="cTarget"></div><textarea id="cText" placeholder="What would you change here?"></textarea>
  <div style="display:flex; gap:6px; margin-top:6px"><button id="cUp" aria-pressed="false">👍</button><button id="cDown" aria-pressed="false">👎</button><span class="spacer"></span><button id="cCancel">Cancel</button><button id="cSave">Save note</button></div></div><div id="noteList"></div></aside>
<div id="flash" aria-live="polite"></div>
<script id="worker-src" type="text/plain">/*WORKER*/</script>
<script>/*APP*/</script>
