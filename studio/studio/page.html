<title>Studio</title>
<!-- Studio: the Studio DAW's two views of a song, as in Ableton: Session (the clip grid: scenes of live clips over the
     ground, with the jam's tools in the Clip tab) and Arrangement (the song on a timeline as notes). Tab, or the switch at
     the top, flips them. Studio Jam v2, the jam as it was, is the third tab: a take recorded there ("Into the
     arrangement") arrives in the Arrangement as a song. One transport plays at a time. Each page is in a frame of this
     one (same origin, so each reaches this page's database), built by studio/studio/build.mjs. -->
<style>
:root{--bg:#10141a; --bar:#0b0e12; --ink:#e6e9ef; --mute:#97a0af; --line:#2c3441; --acc:#e0a33a; --acc-ink:#111; color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eceef1; --bar:#ffffff; --ink:#1a2029; --mute:#5c6573; --line:#cfd4dc; --acc:#b8642a; --acc-ink:#fff; color-scheme:light}}
:root[data-theme="light"]{--bg:#eceef1; --bar:#ffffff; --ink:#1a2029; --mute:#5c6573; --line:#cfd4dc; --acc:#b8642a; --acc-ink:#fff; color-scheme:light}
:root[data-theme="dark"]{--bg:#10141a; --bar:#0b0e12; --ink:#e6e9ef; --mute:#97a0af; --line:#2c3441; --acc:#e0a33a; --acc-ink:#111; color-scheme:dark}
html,body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif}
.sbar{position:fixed; inset:0 0 auto 0; height:44px; display:flex; align-items:center; gap:10px; padding:0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); background:var(--bar); border-bottom:1px solid var(--line); z-index:2; box-sizing:border-box}
.sbar b{font-size:15px; letter-spacing:.02em}
.views{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.views button{font:inherit; font-weight:600; color:var(--mute); background:none; border:0; padding:0 14px; min-height:34px; cursor:pointer}
.views button + button{border-left:1px solid var(--line)}
.views button[aria-pressed="true"]{background:var(--acc); color:var(--acc-ink)}
.views button:focus-visible{outline:2px solid var(--acc); outline-offset:-2px}
.hint{color:var(--mute); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.views + .hint{flex:1}
.xb{font:inherit; font-size:12.5px; color:var(--mute); background:none; border:1px solid var(--line); border-radius:7px; padding:0 9px; min-height:30px; cursor:pointer} .xb:hover{color:var(--ink)}
#flash{position:fixed; left:50%; top:52px; transform:translateX(-50%); background:var(--bar); border:1px solid var(--line); border-radius:8px; padding:6px 12px; z-index:3; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none} #flash[data-on="1"]{opacity:1}
iframe{position:fixed; inset:44px 0 0 0; width:100%; height:calc(100% - 44px); border:0; display:block; background:var(--bg)}
iframe[hidden]{display:none}
@media (max-width:640px){ .xb{padding:0 6px} .hint{display:none} .sbar b{display:none} .views{flex:1} .views button{flex:1 1 0; padding:0 4px; font-size:13px; white-space:nowrap} }
</style>
<div class="sbar" role="toolbar" aria-label="Studio">
  <b>Studio</b>
  <div class="views" role="group" aria-label="View">
    <button id="vSession" aria-pressed="true" title="The clips: scenes of live clips over the ground (Tab)">Session</button><button id="vScene" aria-pressed="false" title="Every part of a scene, one under the other, with the most used controls">Scene</button><button id="vArrange" aria-pressed="false" title="The song on a timeline, as notes (Tab)">Arrangement</button><button id="vJam" aria-pressed="false" title="Studio Jam v2: the jam as it was, parts and cards">Jam v2</button>
  </div>
  <span class="hint" id="hint">Tab flips Session and Arrangement · the Clip tab holds the jam's tools</span>
  <button class="xb" id="exp" title="Everything you've made and set (your likes, songs, sounds, settings) as one file, to take to another account">Export</button><button class="xb" id="imp" title="A file made by Export: everything in it back into this Studio">Import</button><input type="file" id="impF" accept=".json,application/json" hidden>
</div>
<span id="flash" role="status"></span>
<iframe id="fDaw" title="The Studio: Session and Arrangement"></iframe>
<iframe id="fJam" title="Studio Jam v2" hidden></iframe>
<script type="text/plain" id="srcDaw">/*ARRANGE*/</script>
<script type="text/plain" id="srcJam">/*SESSION*/</script>
<script>/*SETTINGS*/</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  // each view's page, unpacked (it's kept as base64 so nothing in it can end this script)
  const page = id => new TextDecoder().decode(Uint8Array.from(atob($(id).textContent.trim()), c => c.charCodeAt(0)));
  // in each frame: this page's runtime (the database) once it's here, and Tab flipping the view wherever the focus isn't text
  const SHIM = `(() => { const P = parent; window.claude = {use: async n => { for (let i = 0; i < 220 && !P.claude?.use; i++) await new Promise(r => setTimeout(r, 50)); try { return P.claude?.use ? await P.claude.use(n) : null; } catch { return null; } }};
    addEventListener('keydown', e => { if (e.key !== 'Tab' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return; const t = e.target; if (t !== document.body && t !== document.documentElement && t.tagName !== 'CANVAS') return; e.preventDefault(); e.stopImmediatePropagation(); P.__studio?.flip(); }, true); })();`;
  const doc = body => `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script>${SHIM}<\/script></head><body>${body}</body></html>`;
  const F = {daw: {f: $('fDaw'), src: 'srcDaw'}, jam: {f: $('fJam'), src: 'srcJam'}}, B = {session: $('vSession'), scene: $('vScene'), arrange: $('vArrange'), jam: $('vJam')};
  const frameOf = k => k === 'jam' ? 'jam' : 'daw';
  let view = 'session';
  function load(k){ const v = F[k]; if (v.ready) return v.ready;
    v.ready = new Promise(r => v.f.addEventListener('load', r, {once: true})).then(async () => { for (let i = 0; i < 200 && !v.f.contentWindow.__studioView; i++) await new Promise(r => setTimeout(r, 50)); return v.f.contentWindow; });
    v.f.srcdoc = doc(page(v.src)); return v.ready; }
  function show(k){ view = k; const fr = frameOf(k); for (const [n, v] of Object.entries(F)) v.f.hidden = n !== fr; for (const [n, b] of Object.entries(B)) b.setAttribute('aria-pressed', String(n === k));
    load(fr).then(w => { if (fr === 'daw') w.__studioView.view?.(k); w.dispatchEvent(new Event('resize')); try { w.focus(); } catch {} }); try { localStorage.setItem('studio.view', k); } catch {} }
  for (const k of Object.keys(B)) B[k].onclick = () => show(k);
  addEventListener('keydown', e => { if (e.key === 'Tab' && !e.shiftKey && !e.metaKey && !e.ctrlKey && !e.altKey && (e.target === document.body || e.target === document.documentElement)) { e.preventDefault(); window.__studio.flip(); } });
  window.__studio = {
    flip: () => show(view === 'arrange' ? 'session' : 'arrange'),
    show, view: () => view,
    // one transport at a time: a view starting to play stops the other
    playing: k => { for (const v of Object.values(F)) try { const w = v.f.contentWindow?.__studioView; if (w && w.name !== k) w.stop(); } catch {} },
    // a take (or your song) from the Session, into the Arrangement as one of its songs
    toArrangement: async song => { const w = await load('daw'); await w.__studioView.addSong(song); show('arrange'); },
  };
  // your settings with your account, and Export / Import (studio/studio/settings.js)
  let flT = 0; const flash = t => { const f = $('flash'); f.textContent = t; f.dataset.on = '1'; clearTimeout(flT); flT = setTimeout(() => f.dataset.on = '', 2600); };
  const reload = () => { for (const v of Object.values(F)) if (v.ready) { v.ready = null; load(Object.keys(F).find(k => F[k] === v)); } show(view); };
  const ST = window.__studioSettings; let db = null; ST.startSettings({reload, flash}).then(d => { db = d; });
  $('exp').onclick = async () => { flash('Gathering everything…'); try { flash('Exported: ' + await ST.exportAll(db)); } catch (e) { flash('Export failed: ' + e.message); } };
  $('imp').onclick = () => $('impF').click();
  $('impF').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; try { const n = await ST.importAll(db, await f.text()); flash(`Imported: your settings and ${n} saved things`); reload(); } catch (x) { flash('Import failed: ' + x.message); } };
  window.__studio.reload = reload;
  let first = 'session'; try { first = localStorage.getItem('studio.view') || 'session'; } catch {}
  load('daw'); show(['arrange', 'jam'].includes(first) ? first : 'session');
})();
</script>
