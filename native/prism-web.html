<title>Prism Test Web</title>
<style>
/* One full-screen dark stage, as the native test: the picture fills the window, a slim bar of glass chips sits at the
   bottom, and the Layers sheet rises above it. A deliberately single (dark) look, like the app it mirrors. */
:root {
  --bg: #000;
  --fg: rgba(255, 255, 255, .92);
  --dim: rgba(255, 255, 255, .7);
  --faint: rgba(255, 255, 255, .4);
  --chip: rgba(60, 60, 72, .42);
  --chip-on: rgba(150, 140, 230, .42);
  --chip-edge: rgba(255, 255, 255, .14);
  --sheet: rgba(18, 18, 26, .72);
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
#bar > * { pointer-events: auto; }
#status { font: 12px/1.45 var(--mono); color: var(--dim); text-align: center; white-space: pre-line; max-width: 100%; }
#chips { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding: 0 4px; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 500 15px var(--ui); color: var(--fg); background: var(--chip); border: 1px solid var(--chip-edge); border-radius: 999px; padding: 9px 14px; -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4); cursor: pointer; }
.chip:active { background: rgba(90, 90, 104, .55); }
.chip[aria-pressed="true"] { background: var(--chip-on); }
.chip:focus-visible, #more:focus-visible, .row:focus-visible, #lv:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.chip[disabled] { opacity: .45; }
#hint { font-size: 11px; color: var(--faint); text-align: center; max-width: 46em; }

#file { display: none; }

/* the Layers sheet */
#sheet { width: min(560px, 100%); max-height: 52vh; overflow-y: auto; background: var(--sheet); border: 1px solid var(--chip-edge); border-radius: 18px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px; -webkit-backdrop-filter: blur(22px) saturate(1.4); backdrop-filter: blur(22px) saturate(1.4); }
.sh-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sh-head span { font: 600 13px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.sh-head b { font: 600 17px var(--ui); }
#lv { width: 100%; accent-color: #b3a8ff; height: 28px; }
.ticks { display: grid; grid-template-columns: repeat(10, 1fr); font: 11px var(--mono); color: var(--faint); text-align: center; margin-top: -6px; }

.row[aria-pressed="true"] { background: var(--chip-on); }
.row .n { font: 600 12px var(--mono); color: var(--faint); grid-row: span 2; padding-top: 2px; }

<script>
// The Prism test in WebGL: the native test (native/PrismTest.swiftpm) ported line for line, then built up in layers of
// complexity (the Layers sheet): 0 the still gem, then the pulse, detail, shapes, patterns and drops the native test has, then
// opening into a star and mountains, surfaces, life on the facets, and the room with its lamps, lasers and camera, each
// brought over from the full Prism (src/visuals/objects/prism.js) one at a time, each its own switch.
'use strict';
const $ = id => document.getElementById(id);

// ---- the layers, simplest first (the Complexity slider turns on 1..n) ----
const LAYERS = [
  {k: 'pulse', t: 'Pulse', d: 'The kick sends rings of light across it; the bass swells it'},
  {k: 'detail', t: 'Detail', d: 'More facets as the groove settles and the music builds'},
  {k: 'shapes', t: 'Shapes', d: 'A new shape each phrase'},
  {k: 'patterns', t: 'Patterns', d: 'Stabs step a lit wedge, hats spark facets, a drop’s run-up fills it'},
  {k: 'drops', t: 'Drops', d: 'It shatters on the drop and comes back sharp'},
  {k: 'open', t: 'Opening', d: 'It blooms open into a star, mountains or waves, and folds back'},
  {k: 'surfaces', t: 'Surfaces', d: 'Stained glass, LED panels, brushed metal, ice, mirror, iridescence'},
  {k: 'life', t: 'Life', d: 'Patterns that live on the facets: spots, stripes, swells, frost, fireflies'},
  {k: 'space', t: 'Space', d: 'A room: a mirror floor, lamps in haze, lasers through it, the camera moving'},
];
const NAMES = ['Still', ...LAYERS.map(l => l.t)];
const ON = Object.fromEntries(LAYERS.map((l, i) => [l.k, i < 5]));
let level = 5;
const on = k => ON[k];

// ---- the feel numbers (Tune in Prism.swift, and TUNE.prism for the layers brought over) ----
const Tune = {r: .62, spin: .22, morphSecs: 3.9, breath: .14, explode: 1.25, explodeSecs: 1.2, ripSecs: 1.6, ripSpeed: .75, ripW: .28,
  kickCalm: .5, fire: 1.35, hatShare: .12, actBase: .22, actBrk: .55, actFree: .4,
  width: .05, pull: 1.2, maxPull: .35, holdRate: .25, bounce: 1, damp: .12, friction: 2.2, maxSpin: 5, turn: 5, tilt: 3, tapBright: .8,
  cam: 3.2, focal: 2.6,
  star: .55, mtn: .3, mtnScale: 2.2, mtnBreath: .5, waveK: 9, waveSpeed: 2.2, openChance: .3, wedges: 5,   // opening
  tex: {calm: [2, .8, .3, .5, 1.2, 1, 1], live: [1, 1.2, 1.2, 1, .5, .8, 1], sweepBeats: 8, change: .3},   // surfaces: glass, stained, led, metal, ice, mirror, iridescent
  cells: {rdRate: 90, du: .2, dv: .1, rdGain: 7, waveC: .25, waveDamp: 2, waveGain: 2, frostRate: 4, frostGrow: .35, frostMelt: 8, flyBeats: 2, flySpread: .3, flyWidth: .35, flyK: .05, flyKBuild: .45, lit: .55},
  room: {floor: -1.05, refl: .32, haze: 1, walls: 6},
  lasers: {max: 6, calm: .45, index: 1.5, depth: 6, splits: 3, width: .007, flare: .02, trace: .9, traceSecs: .6, dropBars: 2}};
const FORMS = {gem: {k: 1, h: 0, wv: 0, pitch: .25, yw: 1, det: 0}, bloom: {k: .45, h: .06, wv: 0, pitch: -.2, yw: .3, det: 1},
  star: {k: 0, h: .3, wv: 0, pitch: -.55, yw: 0, det: 2}, peaks: {k: 0, h: 1, wv: 0, pitch: -1.05, yw: 0, det: 3}, waves: {k: 0, h: .15, wv: 1, pitch: -.85, yw: 0, det: 3}};
const OPEN = ['bloom', 'star', 'peaks', 'waves'];
const TEX = ['glass', 'stained glass', 'LED panels', 'brushed metal', 'ice', 'mirror', 'iridescent'];
const RULES = ['spots', 'stripes', 'swell', 'frost', 'fireflies'];

// ---- small maths ----
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sm = x => x <= 0 ? 0 : x >= 1 ? 1 : x*x*(3 - 2*x);
const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };
const cross = (a, b) => [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
function hash(a, b){ let h = (Math.imul(a, 374761393) + Math.imul(b, 668265263)) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0)/4294967296; }
function hsv(h, s, v){ const hh = (h - Math.floor(h))*6, c = [Math.abs(hh - 3) - 1, 2 - Math.abs(hh - 2), 2 - Math.abs(hh - 4)].map(x => clamp(x, 0, 1));
  return c.map(k => v*((1 - s) + s*k)); }
const h2 = (i, j) => { const x = Math.sin(i*127.1 + j*311.7)*43758.5453; return x - Math.floor(x); };
function vn(x, y){ const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, u = fx*fx*(3 - 2*fx), v = fy*fy*(3 - 2*fy);
  return (h2(i, j)*(1 - u) + h2(i + 1, j)*u)*(1 - v) + (h2(i, j + 1)*(1 - u) + h2(i + 1, j + 1)*u)*v; }
const ICO = (() => { const t = (1 + Math.sqrt(5))/2; return [[-1, t, 0], [1, t, 0], [-1, -t, 0], [1, -t, 0], [0, -1, t], [0, 1, t], [0, -1, -t], [0, 1, -t], [t, 0, -1], [t, 0, 1], [-t, 0, -1], [-t, 0, 1]].map(norm); })();
const m3 = (A, B) => { const C = new Array(9); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) C[i*3 + j] = A[i*3]*B[j] + A[i*3 + 1]*B[3 + j] + A[i*3 + 2]*B[6 + j]; return C; };
const mul = (M, v) => [M[0]*v[0] + M[1]*v[1] + M[2]*v[2], M[3]*v[0] + M[4]*v[1] + M[5]*v[2], M[6]*v[0] + M[7]*v[1] + M[8]*v[2]];
const mulT = (M, v) => [M[0]*v[0] + M[3]*v[1] + M[6]*v[2], M[1]*v[0] + M[4]*v[1] + M[7]*v[2], M[2]*v[0] + M[5]*v[1] + M[8]*v[2]];

// ---- the facet geometry (Geometry.swift): an icosahedron subdivided F times ----
function facetGeo(F = 3){
  const V = ICO.map(v => v.slice());
  let faces = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
    [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
  const ek = (a, b) => a < b ? a*65536 + b : b*65536 + a, elev = new Map();
  for (const [a, b, c] of faces) for (const [p, q] of [[a, b], [b, c], [c, a]]) elev.set(ek(p, q), 0);
  const LV = [faces], PAR = [[]];
  for (let L = 0; L < F; L++) {
    const mid = new Map(), nfs = [], par = [];
    const m = (a, b) => { const k = ek(a, b); let i = mid.get(k); if (i !== undefined) return i;
      i = V.length; V.push(norm([(V[a][0] + V[b][0])/2, (V[a][1] + V[b][1])/2, (V[a][2] + V[b][2])/2])); mid.set(k, i);
      const l = elev.get(k) ?? 0; elev.set(ek(a, i), l); elev.set(ek(i, b), l); return i; };
    faces.forEach(([a, b, c], fi) => { const ab = m(a, b), bc = m(b, c), ca = m(c, a);
      for (const [p, q] of [[ab, bc], [bc, ca], [ca, ab]]) elev.set(ek(p, q), L + 1);
      nfs.push([a, ab, ca], [ab, b, bc], [ca, bc, c], [ab, bc, ca]); par.push(fi, fi, fi, fi); });
    faces = nfs; LV.push(nfs); PAR.push(par);
  }
  const nv = V.length, nf = faces.length;
  const FA = []; for (let L = 0; L <= F; L++) FA.push(new Int32Array(nf));
  for (let f = 0; f < nf; f++) { let g = f; for (let L = F; L >= 0; L--) { FA[L][f] = g; if (L > 0) g = PAR[L][g]; } }
  const EL = new Int32Array(nf*3), TRI = new Int32Array(nf*3);
  faces.forEach(([a, b, c], f) => { TRI[f*3] = a; TRI[f*3 + 1] = b; TRI[f*3 + 2] = c; EL[f*3] = elev.get(ek(b, c)) ?? 0; EL[f*3 + 1] = elev.get(ek(c, a)) ?? 0; EL[f*3 + 2] = elev.get(ek(a, b)) ?? 0; });
  // each facet's neighbours at every level (sharing an edge)
  const ADJ = LV.map(fl => { const adj = new Int32Array(fl.length*3).fill(-1), byEdge = new Map();
    fl.forEach(([a, b, c], f) => [[a, b], [b, c], [c, a]].forEach(([p, q], j) => { const k = ek(p, q), o = byEdge.get(k); if (o) { adj[f*3 + j] = o[0]; adj[o[0]*3 + o[1]] = f; } else byEdge.set(k, [f, j]); }));
    return adj; });
  return {F, nv, nf, V, LV, FA, TRI, EL, ADJ};
}
// the gem cut open (gemSheetGeo in src/render/facet.js): the ball turned so a corner faces us, cut along its edges into five
// gores, a corner on a cut one corner per gore, so it can open like a flower into a flat star. Closed, it's the ball exactly
function gemSheet(B){
  const {F, V, LV, FA, TRI, EL, ADJ, nf} = B;
  const p = V[0], ax = norm(cross(p, [0, 0, 1])), an = Math.acos(clamp(p[2], -1, 1));
  const rot = d => { const c = Math.cos(an), s = Math.sin(an), k = dot(ax, d), x = cross(ax, d); return [d[0]*c + x[0]*s + ax[0]*k*(1 - c), d[1]*c + x[1]*s + ax[1]*k*(1 - c), d[2]*c + x[2]*s + ax[2]*k*(1 - c)]; };
  const RV = V.map(rot), az = d => Math.atan2(d[1], d[0]), cen0 = f => norm(LV[0][f].reduce((a, i) => [a[0] + RV[i][0], a[1] + RV[i][1], a[2] + RV[i][2]], [0, 0, 0]));
  const gore = new Int8Array(20).fill(-1), A0 = ADJ[0], has0 = f => LV[0][f].includes(0);
  const T = [...Array(20).keys()].filter(has0).sort((a, b) => az(cen0(a)) - az(cen0(b)));
  const wrap = a => Math.atan2(Math.sin(a), Math.cos(a)), GCs = [];
  T.forEach((t, i) => {
    const D = [0, 1, 2].map(j => A0[t*3 + j]).find(f => !has0(f));
    const Us = [0, 1, 2].map(j => A0[D*3 + j]).filter(f => f !== t), U = wrap(az(cen0(Us[0])) - az(cen0(D))) > 0 ? Us[0] : Us[1];
    const Bk = [0, 1, 2].map(j => A0[U*3 + j]).find(f => ![0, 1, 2].some(k => T.includes(A0[f*3 + k])));
    for (const f of [t, D, U, Bk]) gore[f] = i;
    const c = [t, D, U, Bk].reduce((a, f) => { const d = cen0(f); return [a[0] + d[0], a[1] + d[1]]; }, [0, 0]); GCs.push(Math.atan2(c[1], c[0]));
  });
  const copy = new Map(), SRC = [], GO = [], fg = f => gore[FA[0][f]];
  const id = (v, g) => { const k = v*8 + g; let i = copy.get(k); if (i === undefined) { i = SRC.length; copy.set(k, i); SRC.push(v); GO.push(g); } return i; };
  const NT = new Int32Array(nf*3); for (let f = 0; f < nf; f++) for (let j = 0; j < 3; j++) NT[f*3 + j] = id(TRI[f*3 + j], fg(f));
  const AI = [], AW = [];
  for (let L = 0; L <= F; L++) { const done = new Set();
    for (let f = 0; f < nf; f++) for (let j = 0; j < 3; j++) {
      const v = NT[f*3 + j]; if (done.has(v)) continue; done.add(v);
      const [a, b, c] = LV[L][FA[L][f]], d = V[SRC[v]], n = cross(sub(V[b], V[a]), sub(V[c], V[a])), k = dot(n, V[a])/dot(n, d), X = [d[0]*k, d[1]*k, d[2]*k];
      const ar = (q, r) => dot(n, cross(sub(V[r], V[q]), sub(X, V[q]))), tot = dot(n, n), wa = ar(b, c)/tot, wb = ar(c, a)/tot, o = (v*(F + 1) + L)*3, g = GO[v];
      AI[o] = id(a, g); AI[o + 1] = id(b, g); AI[o + 2] = id(c, g); AW[o] = wa; AW[o + 1] = wb; AW[o + 2] = 1 - wa - wb;
    } }
  const nv = SRC.length, DIR = [], TH = new Float32Array(nv), PS = new Float32Array(nv), GC = new Float32Array(nv), SX = new Float32Array(nv), SY = new Float32Array(nv);
  for (let i = 0; i < nv; i++) { const d = RV[SRC[i]]; DIR.push(d); TH[i] = Math.acos(clamp(d[2], -1, 1)); GC[i] = GCs[GO[i]];
    PS[i] = Math.hypot(d[0], d[1]) < 1e-6 ? 0 : wrap(az(d) - GC[i]);
    const sc = TH[i] < 1e-4 ? 1 : Math.sin(TH[i])/TH[i], ps = GC[i] + PS[i]*sc; SX[i] = TH[i]*Math.cos(ps); SY[i] = TH[i]*Math.sin(ps); }   // (where it lies on the flat star)
  const CEN = LV.map(l => l.map(([a, b, c]) => norm([RV[a][0] + RV[b][0] + RV[c][0], RV[a][1] + RV[b][1] + RV[c][1], RV[a][2] + RV[b][2] + RV[c][2]])));
  return {F, nv, nf, tri: NT, el: EL, fa: FA, cen: CEN, adj: ADJ, ai: Int32Array.from(AI), aw: Float32Array.from(AW), dir: DIR, TH, PS, GC, SX, SY, nfAt: LV.map(l => l.length)};
}

// ---- life on the facets (src/visuals/objects/cells.js) ----
function makeCells(NA, ADJ, rnd){
  const C = {NA, ADJ, u: new Float32Array(NA).fill(1), v: new Float32Array(NA), lu: new Float32Array(NA), lv: new Float32Array(NA),
    h: new Float32Array(NA), hv: new Float32Array(NA), f: new Float32Array(NA), ph: new Float32Array(NA), om: new Float32Array(NA), out: new Float32Array(NA), acc: 0};
  for (let c = 0; c < NA; c++) { C.ph[c] = rnd()*Math.PI*2; C.om[c] = rnd() - .5; }
  return C;
}
const GS = {spots: [.03, .062], stripes: [.04, .06]};
function lap(C, x, o){ const {NA, ADJ} = C; for (let c = 0; c < NA; c++) { let s = 0, n = 0; for (let j = 0; j < 3; j++) { const k = ADJ[c*3 + j]; if (k >= 0) { s += x[k]; n++; } } o[c] = n ? s/n - x[c] : 0; } }
function touchCells(C, rule, cells, amt = 1){
  for (const c of cells) {
    if (rule === 'spots' || rule === 'stripes') { C.v[c] = Math.min(1, C.v[c] + .5*amt); C.u[c] = Math.max(0, C.u[c] - .5*amt); }
    else if (rule === 'swell') C.hv[c] += amt;
    else if (rule === 'frost') C.f[c] = 1;
    else if (rule === 'fireflies') C.ph[c] = 0;
  }
}
function stepCells(C, rule, dt, T, beat, K, rnd){
  const {NA, out} = C; beat = beat > .2 ? beat : .5;
  if (rule === 'spots' || rule === 'stripes') {
    const [F, k] = GS[rule]; C.acc += dt*T.rdRate;
    for (; C.acc >= 1; C.acc--) { lap(C, C.u, C.lu); lap(C, C.v, C.lv);
      for (let c = 0; c < NA; c++) { const u = C.u[c], v = C.v[c], r = u*v*v;
        C.u[c] = clamp(u + T.du*C.lu[c] - r + F*(1 - u), 0, 1); C.v[c] = clamp(v + T.dv*C.lv[c] + r - (F + k)*v, 0, 1); } }
    let mx = 0; for (let c = 0; c < NA; c++) { mx = Math.max(mx, C.v[c]); const x = clamp((C.v[c] - .04)*T.rdGain, 0, 1); out[c] = x*x*(3 - 2*x); }
    if (mx < .08) for (let i = 0; i < 8; i++) { const c = Math.floor(rnd()*NA); C.v[c] = .5; C.u[c] = .5; }

      gl.useProgram(room.p); gl.bindVertexArray(qvao); const u = room.u, amb = hsv(st.h0 + st.palSpread, .35, 1);
      gl.uniform4f(u.uRm, a, f, cz, Tune.room.floor);
      gl.uniform4f(u.uL0d, ...L[0], 0); gl.uniform4f(u.uL0c, ...L[1], 0); gl.uniform4f(u.uL1d, ...L[2], 0); gl.uniform4f(u.uL1c, ...L[3], 0);
      gl.uniform4f(u.uAmb, amb[0], amb[1], amb[2], Tune.room.haze);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    // the facets: its reflection in the floor (space), then the far side, then the near
    gl.useProgram(facets.p); gl.bindVertexArray(vao); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, prism.verts);
    const u = facets.u;
    gl.uniformMatrix4fv(u.uProj, false, [f/a, 0, 0, 0, 0, f, 0, 0, 0, 0, zf/(zn - zf), -1, 0, 0, zn*zf/(zn - zf), 0]);
    gl.uniform4f(u.uCam, 0, 0, cz, 0);
    ['uL0d', 'uL0c', 'uL1d', 'uL1c', 'uL2d', 'uL2c'].forEach((k, i) => gl.uniform4f(u[k], L[i][0], L[i][1], L[i][2], 0));
    gl.uniform4f(u.uP, Tune.fire, 1, .2, .45);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    for (const mir of space ? [1, 0] : [0]) {
      gl.uniform4f(u.uMir, mir, Tune.room.floor, Tune.room.refl, 0);
      for (let side = 0; side < 2; side++) { gl.uniform4f(u.uP2, .45, .6, 1.5*dprNow, side); gl.drawArrays(gl.TRIANGLES, 0, prism.G.nf*3); }
    }
    // the lasers over it
    if (space && st.beams.segs.length) {
      const n = beamQuads(S, f, a, cz);
      if (n) { gl.useProgram(beams.p); gl.bindVertexArray(bvao); gl.bindBuffer(gl.ARRAY_BUFFER, bbuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, barr.subarray(0, n*8));
        gl.blendFunc(gl.ONE, gl.ONE); gl.drawArrays(gl.TRIANGLES, 0, n); }
    }
    gl.disable(gl.BLEND);
    // the glow: the picture at half size, blurred
    quad(copy, S.half.fb, S.half.w, S.half.h); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.scene.t); gl.uniform1i(copy.u.uT, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    quad(blur, S.blur.fb, S.half.w, S.half.h); gl.bindTexture(gl.TEXTURE_2D, S.half.t); gl.uniform1i(blur.u.uT, 0); gl.uniform2f(blur.u.uDir, 1/S.half.w, 0); gl.drawArrays(gl.TRIANGLES, 0, 3);
    quad(blur, S.half.fb, S.half.w, S.half.h); gl.bindTexture(gl.TEXTURE_2D, S.blur.t); gl.uniform2f(blur.u.uDir, 0, 1/S.half.h); gl.drawArrays(gl.TRIANGLES, 0, 3);
    // the finish
    quad(comp, null, S.w, S.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, S.scene.t); gl.uniform1i(comp.u.uS, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, S.half.t); gl.uniform1i(comp.u.uB, 1);
    gl.uniform4f(comp.u.uCp, .9, 1.25, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.activeTexture(gl.TEXTURE0);
  };
}

// ---- the screen ----
let prism, draw, fps = 0, last = 0, note = '', detail = -1;
try { prism = makePrism(); draw = makeRenderer($('cv'), prism); }
catch (e) { $('err').hidden = false; $('err').textContent = 'The picture can\'t start here: ' + e.message; }

function frame(ts){
  requestAnimationFrame(frame);
  if (!prism) return;
  const dt = last ? Math.min(.1, (ts - last)/1000) : 1/60; last = ts;
  fps += (1/Math.max(dt, 1e-3) - fps)*.05;
  prism.step(dt, player);
  draw();
}
requestAnimationFrame(frame);

// the layers: the slider turns on the first n; a switch on its own makes it custom; kept on the device
const levelOf = () => { let n = 0; while (n < LAYERS.length && ON[LAYERS[n].k]) n++; return LAYERS.every((l, i) => ON[l.k] === i < n) ? n : -1; };
const save = () => { try { localStorage.setItem('prismweb.layers', JSON.stringify(ON)); } catch (e) {} };
function showLayers(){
  const lv = levelOf();
  $('lvName').textContent = lv < 0 ? 'Custom' : `${lv} · ${NAMES[lv]}`;
  if (lv >= 0) $('lv').value = lv;
  document.querySelectorAll('.row').forEach(r => r.setAttribute('aria-pressed', ON[r.dataset.k] ? 'true' : 'false'));
}
$('rows').innerHTML = LAYERS.map((l, i) => `<button class="row" id="ly-${l.k}" data-k="${l.k}" aria-pressed="false"><span class="n">${i + 1}</span><span class="t">${l.t}</span><span class="d">${l.d}</span></button>`).join('');
document.querySelectorAll('.row').forEach(r => r.onclick = () => { ON[r.dataset.k] = !ON[r.dataset.k]; save(); showLayers(); });
$('lv').oninput = e => { const n = +e.target.value; LAYERS.forEach((l, i) => ON[l.k] = i < n); save(); showLayers(); };
try { const s = JSON.parse(localStorage.getItem('prismweb.layers') || 'null'); if (s) for (const l of LAYERS) if (l.k in s) ON[l.k] = !!s[l.k]; } catch (e) {}
showLayers();
$('bLayers').onclick = () => { const open = $('sheet').hidden; $('sheet').hidden = !open; $('bLayers').setAttribute('aria-pressed', open ? 'true' : 'false'); };
$('bDone').onclick = () => { $('sheet').hidden = true; $('bLayers').setAttribute('aria-pressed', 'false'); };
$('bCopy').onclick = () => {
  const lv = levelOf(), txt = JSON.stringify({prismWebLayers: lv < 0 ? 'custom' : lv, on: LAYERS.filter(l => ON[l.k]).map(l => l.k)});
  const done = () => { $('bCopy').textContent = 'Copied'; setTimeout(() => { $('bCopy').textContent = 'Copy settings'; }, 1500); };
  try { navigator.clipboard.writeText(txt).then(done, () => { note = txt; setTimeout(() => { note = ''; }, 6000); }); } catch (e) { note = txt; setTimeout(() => { note = ''; }, 6000); }
};

setInterval(() => {
  if (!prism) return;
  const st = prism.st, lv = levelOf();
  $('status').textContent = note || `${st.info}\n${prism.describe()} · ${prism.facets} facets · activity ${Math.round(st.act*100)}% · ${Math.round(fps)} fps\nLayers: ${lv < 0 ? 'custom' : lv + ' · ' + NAMES[lv]}`;
  $('bPlay').textContent = player.playing ? 'Pause' : 'Play';
}, 500);
const setBusy = (b, msg = '') => { note = msg; document.querySelectorAll('#chips .chip').forEach(c => c.disabled = b); };
$('bMusic').onclick = () => $('file').click();
$('file').onchange = async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  const ctx = player.ensure(); ctx.resume();
  setBusy(true, 'Reading ahead…');
  try {
    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
    const mono = new Float32Array(buf.length), k = 1/buf.numberOfChannels;
    for (let c = 0; c < buf.numberOfChannels; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) mono[i] += d[i]*k; }
    const A = await analyse(mono, buf.sampleRate, p => { note = `Reading ahead… ${Math.round(p*100)}%`; $('status').textContent = note; });
    prism.st.lastT = -1;
    player.start(buf, A, file.name.replace(/\.[^.]+$/, ''), false);
    setBusy(false);
  } catch (err) { setBusy(false); note = 'Couldn\'t play it: ' + (err.message || err); setTimeout(() => { note = ''; }, 4000); }
};
$('bDemo').onclick = async () => {
  const ctx = player.ensure(); ctx.resume();
  setBusy(true, 'Making the demo beat…');
  await new Promise(r => setTimeout(r, 30));
  const {buf, mono, sr} = demoBeat(ctx), A = await analyse(mono, sr, () => {});
  prism.st.lastT = -1;
  player.start(buf, A, 'Demo beat', true);
  setBusy(false);
};
$('bPlay').onclick = () => { player.toggle(); };
$('bShape').onclick = () => prism.nextShape();
$('bDrop').onclick = () => prism.drop();
$('bFacets').onclick = () => { const modes = [-1, 0, 1, 2, 3]; detail = modes[(modes.indexOf(detail) + 1) % modes.length]; prism.st.detailMode = detail;
  $('bFacets').textContent = detail < 0 ? 'Facets: auto' : 'Facets: ' + [20, 80, 320, 1280][detail]; };
$('bHide').onclick = () => { $('bar').hidden = true; $('more').hidden = false; };
$('more').onclick = () => { $('bar').hidden = false; $('more').hidden = true; };

// touch: one finger is Jam, two pinch
const cv = $('cv'), ptrs = new Map(); let pinch = null;
const rect = () => cv.getBoundingClientRect();
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = rect();
  if (ptrs.size === 1) prism.touchBegan(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
  else if (ptrs.size === 2) { prism.touchEnded(); const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a[0] - b[0], a[1] - b[1]), z: prism.st.camZ}; }
});
cv.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const r = rect();
  if (pinch && ptrs.size >= 2) { const [a, b] = [...ptrs.values()]; prism.zoom(pinch.z/Math.max(.2, Math.hypot(a[0] - b[0], a[1] - b[1])/pinch.d)); }
  else if (ptrs.size === 1) prism.touchMoved(e.clientX - r.left, e.clientY - r.top, r.width, r.height);
});
const up = e => { if (!ptrs.delete(e.pointerId)) return; if (ptrs.size < 2) pinch = null; if (ptrs.size === 0) prism.touchEnded(); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
cv.addEventListener('wheel', e => { e.preventDefault(); prism.zoom(prism.st.camZ*Math.exp(e.deltaY*.001)); }, {passive: false});
try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
window.__prism = {prism, ON, LAYERS};   // (for checking it headless)
</script>
